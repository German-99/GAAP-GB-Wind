services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"   # API and interactive docs at http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
 
  frontend:
    build: ./frontend
    ports:
      - "8080:80"     # web app at http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped